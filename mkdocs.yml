# BEMGen documentation site. Build it with `mkdocs build --strict` (scripts/build.ps1) and serve it with `mkdocs serve`
# (scripts/serve.ps1). The component reference, the icons, the screenshots, the developer pages except developer/index.md,
# and the Developer navigation block below are generated by scripts/import_reference.py from a BEMGen docs export; do not
# edit them by hand.
site_name: BEMGen
site_description: Building energy models at several levels of detail in Grasshopper for Rhino 8
site_author: Environmental Systems Lab
copyright: Copyright &copy; 2026 Environmental Systems Lab. MIT License.
site_url: https://energy-atlas.github.io/BEMGen-docs/
repo_url: https://github.com/energy-atlas/BEMGen-docs
repo_name: energy-atlas/BEMGen-docs
edit_uri: ""

site_dir: site
strict: true

theme:
  name: material
  # overrides/main.html preloads the main fonts, so a full page load draws its first frame with them.
  custom_dir: overrides
  language: en
  # No font host: docs/assets/stylesheets/fonts.css serves the fonts from the site (design/ui-design-spec.md, 0.4).
  font: false
  features:
    # Instant navigation swaps only the page content, so the header, sidebars, and fonts persist between pages.
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/bemgen.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors, so that the links between documents in docs/ work on the site as they do on GitHub.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Every broken link, missing nav target, and unlisted page is a warning, so `--strict` fails on it.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# The "Component reference" pages are listed in toolbar order; a panel page the import writes and this list lacks fails the
# strict build. The "Developer" section between the marker comments is written by scripts/import_reference.py from the
# export's developer-nav.json.
