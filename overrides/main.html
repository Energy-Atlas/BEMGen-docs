{% extends "base.html" %}

{#-
  Preload the two fonts every page uses (docs/assets/stylesheets/fonts.css), so that the browser fetches them while it
  parses the page instead of after it has laid the page out, and the first frame is drawn without a font swap.
-#}
{% block extrahead %}
  <link rel="preload" href="{{ 'assets/fonts/geist-latin.woff2' | url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ 'assets/fonts/geist-mono-latin.woff2' | url }}" as="font" type="font/woff2" crossorigin>
{% endblock %}
